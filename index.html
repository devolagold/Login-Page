        <header class="form-header">
          <h1 class="form-title">Sign in to your account</h1>
          <p class="form-subtitle">Please enter your details to log into your account.</p>
        </header>

        <!-- Success Message Banner -->
        <div id="success-banner" class="success-banner" role="alert">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
              clip-rule="evenodd" />
          </svg>
          <span id="success-text">Success! You are now signed in.</span>
        </div>

        <!-- Form Element -->
        <form id="login-form" class="login-form" action="#" method="POST" novalidate>

          <!-- Email Field -->
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email address"
                autocomplete="username" required enterkeyhint="next">
            </div>
            <!-- Dynamic Accessible Error Indicator -->
            <div id="email-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label for="current-password" class="form-label">Password</label>
            <div class="input-wrapper">
              <input type="password" id="current-password" name="password" class="form-input password-input"
                placeholder="••••••••••••" autocomplete="current-password" required enterkeyhint="done">
              <!-- Show/Hide Toggle Button -->
              <button type="button" id="password-toggle" class="password-toggle" aria-label="Show password"
                aria-pressed="false">
                <!-- Eye open SVG icon -->
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <!-- Dynamic Accessible Error Indicator -->
            <div id="password-error" class="error-message" role="alert" aria-live="polite"></div>
          </div>

          <!-- Forgot Password -->
          <div class="forgot-password-container">
            <a href="#" class="forgot-password-link">Forgot password?</a>
          </div>

          <!-- Sign In Button -->
          <button type="submit" id="submit-btn" class="submit-btn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-text">Sign In</span>
            <span class="btn-arrow" aria-hidden="true">▸</span>
          </button>

        </form>

        <footer class="form-footer">
          Don't have an account? <a href="#" class="footer-link">Create one here</a>
        </footer>
      </div>
